# =====================================================================
# The "Anjo da máquina" Protocol - 聖なる法度 (機能・非機能要件 定義書)
# 
# 稼働後のシステムが満たすべき目標値（SLA）を定義するファイル。
# ※このファイルの数値を事後的に書き換えると「メタトロンの印」が破れ、
# 最後の審判（キルスイッチ）が発動する。
# =====================================================================

# ---------------------------------------------------------------------
# 【機能要件】 権天使の試練 (Principalities) 
# システムが期待通りに正しく動くか、その完璧な振る舞いを定義する。
# ---------------------------------------------------------------------
functional_requirements:
  
  # 絶対に成功しなければならないシナリオ名（E2Eテストの対象）
  mandatory_scenarios:
    - "scenario_fund_application"   # 資金の申請が正しく行えるか
    - "scenario_audit_approval"     # 審査が正しく承認（または否認）されるか
    - "scenario_token_distribution" # 承認後、トークンが正しく分配されるか
  
  # すべてのシナリオが完了した後の、最終的なシステムの正しい状態
  expected_final_state: "COMPLETED"
  
  # 許容されるエラー率（ゼロトラストのため、原則 0.0% とする）
  allowed_error_rate_percent: 0.0


# ---------------------------------------------------------------------
# 【非機能要件】 力天使の試練 (Virtues) 
# システムがどれだけの大群勢（負荷）や遅延に耐えられるかを定義する。
# ---------------------------------------------------------------------
non_functional_requirements:
  
  # 仮想的にぶつける「同時アクセス数（大群勢の数）」
  concurrent_users: 100
  
  # 許容される「最大レスポンスタイム」（ミリ秒）
  # 100人が同時にアクセスしても、この時間内に処理を完了しなければならない
  max_response_time_ms: 2000
  
  # 許容されるサーバーのCPU使用率の上限（パーセント）
  cpu_utilization_limit_percent: 80.0
