name: The SHISEI Protocol Audit

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  shisei-audit:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Run Integrity & Docs-as-Code Pipeline
      working-directory: .
      run: |
        python examples/parse_and_guard.py
