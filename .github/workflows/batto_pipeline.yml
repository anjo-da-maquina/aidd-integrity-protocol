name: AIDD Integrity Protocol - Batto (抜刀)

# リポジトリに変更がプッシュされた際、または手動で実行
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  shisei-audit:
    name: 至誠と暗部の統合監査 (Zero-Trust Audit)
    runs-on: ubuntu-latest

    steps:
      - name: 1. 精神の統一 (Checkout Repository)
        uses: actions/checkout@v3

      - name: 2. 道場の準備 (Set up Python)
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 3. 忍具の準備 (Install Dependencies)
        run: |
          python -m pip install --upgrade pip
          pip install networkx

      - name: 4. 侍の刃 (Shisei Protocol - 表の論理監査)
        run: |
          echo "=== 侍の刃：直積マトリクスと出所証明の検証を開始 ==="
          python examples/parse_and_guard.py

      - name: 5. 蜘蛛の糸 (Kumonoito Protocol - 裏の資金監査)
        run: |
          echo "=== 忍びの刃：有向グラフによる資金還流の監査を開始 ==="
          # 一旦、蜘蛛の糸を単独で起動し、文法や構造に恥がないかテストする
          python -c "
          from shinobi.kumonoito_analyzer import KumonoitoAnalyzer
          analyzer = KumonoitoAnalyzer()
          analyzer.add_transaction('DummyGov', 'DummyNPO', 1000)
          analyzer.execute_audit()
          "

      - name: 6. 残心 (Zanshin - State Lock)
        if: success()
        run: |
          echo "すべての刃が異常なしと判定。AIの思考と資金の流れに『恥』は存在しない。"
          echo "プロトコルは静謐を保ち、稼働を継続する。"
