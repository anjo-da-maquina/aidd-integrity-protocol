name: AIDD Integrity Protocol - Batto (抜刀)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  shisei-audit:
    name: 至誠と暗部の統合監査 (Zero-Trust Audit)
    runs-on: ubuntu-latest

    steps:
      - name: 1. 精神の統一 (Checkout Repository)
        uses: actions/checkout@v3

      - name: 2. 道場の準備 (Set up Python)
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 3. 忍具の準備 (Install Dependencies)
        # pyyaml を追加インストール
        run: |
          python -m pip install --upgrade pip
          pip install networkx pyyaml

      - name: 3.2 影討ち (Kageuchi - 使い回しの封殺)
        run: |
          echo "=== 忍びの刃：『影討ち』によるリプレイ攻撃の監査を開始 ==="
          python shinobi/kageuchi_nonce.py

      - name: 3.5 鉄菱 (Tetsubishi - 前提条件と要件定義の改ざん防止)
        run: |
          echo "=== 忍びの刃：『鉄菱』によるルールの不変性チェックを開始 ==="
          python shinobi/tetsubishi_commitment.py

      - name: 4. 侍の刃 (Shisei Protocol - 表の論理監査)
        run: |
          echo "=== 侍の刃：直積マトリクスと出所証明の検証を開始 ==="
          python examples/parse_and_guard.py

      - name: 4.5 蛍火 (Hotarubi - 機密漏洩・インジェクション監査)
        run: |
          echo "=== 忍びの刃：『蛍火』によるカナリア・トラップの監視を開始 ==="
          python shinobi/hotarubi_canary.py

      - name: 4.7 水鏡 (Mizukagami - 意味論的ドリフト監査)
        run: |
          echo "=== 忍びの刃：『水鏡』によるハルシネーション・言葉遊びの監視を開始 ==="
          python shinobi/mizukagami_semantic.py

      - name: 5. 蜘蛛の糸 (Kumonoito Protocol - 裏の資金監査)
        run: |
          echo "=== 忍びの刃：有向グラフによる資金還流の監査を開始 ==="
          python -c "
          from shinobi.kumonoito_analyzer import KumonoitoAnalyzer
          analyzer = KumonoitoAnalyzer()
          analyzer.add_transaction('DummyGov', 'DummyNPO', 1000)
          analyzer.execute_audit()
          "

      - name: 5.5 蛇 (Hebi Oracle - 物理空間の単独潜入監査)
        run: |
          echo "=== 忍びの刃：『蛇』による物理空間の偽装監査を開始 ==="
          python shinobi/hebi_oracle.py

      - name: 5.8 目利き (Mekiki - スマートコントラクト鑑定)
        run: |
          echo "=== 忍びの刃：『目利き』によるブロックチェーン武具の鑑定を開始 ==="
          python shinobi/mekiki_auditor.py

      - name: 6. 残心 (Zanshin - デプロイ許可)
        run: |
          echo "すべての論理・物理監査を通過。これより本稼働環境へデプロイする。"

      - name: 7. 御前試合 (Gozen-jiai - 機能要件E2E監査)
        run: |
          echo "=== 侍の刃：『御前試合』による機能要件の実演証明を開始 ==="
          python shinobi/gozen_jiai_e2e.py

      - name: 8. 百人斬り (Hyakuningiri - 非機能要件負荷監査)
        run: |
          echo "=== 忍びの刃：『百人斬り』による高負荷耐性の証明を開始 ==="
          python shinobi/hyakuningiri_load.py

      - name: 9. 介錯 (Kaishaku - 連座制キルスイッチ)
        if: failure()
        run: |
          echo "=== 致命的な恥（不正・要件未達）を検知。介錯を実行する ==="
          python shinobi/kaishaku_killswitch.py
